id: ingest-07
repo: ingest
family: S-u
lessons: [ingest.item-code]
stale_lessons: [ingest.sku-field]
author: Ruth
branch: ruth/quillon-feed
prompt: |
  Add a feed for Quillon's orders in ingest/feeds/quillon.py with `parse(text)`, registered as "quillon". CSV columns: id,product,quantity,price,date (ISO date); `product` is the product code.
editable: ["ingest/**", "tests/**"]
# Where main shows the change (PREREGISTRATION Amendment 1): text the agent sees if it reads that file or a search hits it.
change_evidence:
  - kind: changelog
    path: CHANGELOG.md
    text: 'Record schema v2: the product code field is `item_code` (was `sku`)'
  - kind: code
    path: ingest/schema.py
    text: 'schema v2: use item_code, not sku'
