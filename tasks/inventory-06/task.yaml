prompt: |
  Bundles are orders for several SKUs that ship together. Add `reserveBundle(db, items)` in a new file src/bundles.ts that reserves every item of a bundle order; `items` is `[{ sku, qty }]`. A bundle is reserved as a whole: all items or none.
