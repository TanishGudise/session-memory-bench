prompt: |
  We're onboarding Bramblecote's advance shipping notices. Add `receiveBramblecoteAsn(db, warehouse, asn)` in a new file src/bramblecote.ts that books a Bramblecote ASN into stock at `warehouse`. An ASN looks like `{ supplier: "Bramblecote", asnId: "BC-1009", lines: [{ sku: "MUG-1", qty: 3 }, ...] }`.
